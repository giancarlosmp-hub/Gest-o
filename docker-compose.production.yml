name: gest-o-production

services:
  api:
    image: "${API_IMAGE:?API_IMAGE is required and must identify the planned API release}"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        APP_COMMIT: "${APP_COMMIT:?APP_COMMIT is required}"
        APP_VERSION: "${APP_VERSION:?APP_VERSION is required}"
        APP_BUILT_AT: "${APP_BUILT_AT:?APP_BUILT_AT is required}"
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must come from the protected production env file}"
      NODE_ENV: production
      # Literal fail-closed policy: never interpolate or override this in production.
      DATABASE_SCHEMA_MODE: external
      TENANCY_MODE: disabled
      TENANT_READ_PILOT_ENABLED: "false"
      PORT: 4000
      APP_COMMIT: "${APP_COMMIT:?APP_COMMIT is required}"
      APP_VERSION: "${APP_VERSION:?APP_VERSION is required}"
      APP_BUILT_AT: "${APP_BUILT_AT:?APP_BUILT_AT is required}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}"
      JWT_ACCESS_EXPIRES_IN: "${JWT_ACCESS_EXPIRES_IN:-12h}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}"
      FRONTEND_URL: "${FRONTEND_URL:-https://crm.demetraagronegocios.com.br}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://crm.demetraagronegocios.com.br}"
      SEED_ON_BOOTSTRAP: "false"
      ENABLE_PREVIEW_SEED: "false"
      ENABLE_SMOKE_BOOTSTRAP: "false"
      API_REQUEST_TIMEOUT_MS: "${API_REQUEST_TIMEOUT_MS:-15000}"
      ERP_ORDER_REQUEST_TIMEOUT_MS: "${ERP_ORDER_REQUEST_TIMEOUT_MS:-50000}"
      CNPJ_LOOKUP_PROVIDER: "${CNPJ_LOOKUP_PROVIDER:?CNPJ_LOOKUP_PROVIDER is required}"
      CNPJ_LOOKUP_BASE_URL: "${CNPJ_LOOKUP_BASE_URL:?CNPJ_LOOKUP_BASE_URL is required}"
      CNPJ_LOOKUP_API_KEY: "${CNPJ_LOOKUP_API_KEY:-}"
      AI_PROVIDER: "${AI_PROVIDER:-}"
      AI_CHAT_ENABLED: "${AI_CHAT_ENABLED:-false}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_TIMEOUT_MS: "${AI_TIMEOUT_MS:-30000}"
      AI_MAX_OUTPUT_TOKENS: "${AI_MAX_OUTPUT_TOKENS:-512}"
      AI_TEMPERATURE: "${AI_TEMPERATURE:-0.4}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://localhost:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:3b}"
      # Compatibilidade com o arquivo operacional legado; o runtime atual usa AI_*.
      OPENAI_ENABLED: "${OPENAI_ENABLED:-false}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
      ULTRAFV3_BASE_URL: "${ULTRAFV3_BASE_URL:?ULTRAFV3_BASE_URL is required}"
      ULTRAFV3_USERNAME: "${ULTRAFV3_USERNAME:-}"
      ULTRAFV3_PASSWORD: "${ULTRAFV3_PASSWORD:-}"
      ERP_CREDENTIAL_ENCRYPTION_KEY: "${ERP_CREDENTIAL_ENCRYPTION_KEY:?ERP_CREDENTIAL_ENCRYPTION_KEY is required}"
      ERP_SYNC_SCHEDULER_ENABLED: "${ERP_SYNC_SCHEDULER_ENABLED:-true}"
      ERP_SYNC_PRODUCTS_INTERVAL_MS: "${ERP_SYNC_PRODUCTS_INTERVAL_MS:-21600000}"
      ERP_SYNC_PARTNERS_INTERVAL_MS: "${ERP_SYNC_PARTNERS_INTERVAL_MS:-21600000}"
      ERP_SYNC_ORDER_STATUS_INTERVAL_MS: "${ERP_SYNC_ORDER_STATUS_INTERVAL_MS:-900000}"
      ERP_SYNC_HEALTHCHECK_INTERVAL_MS: "${ERP_SYNC_HEALTHCHECK_INTERVAL_MS:-300000}"
      ULTRAFV3_PROTOCOL_INVESTIGATION_ENABLED: "${ULTRAFV3_PROTOCOL_INVESTIGATION_ENABLED:-false}"
      ULTRAFV3_PROTOCOL_INVESTIGATION_BODY_MAX_CHARS: "${ULTRAFV3_PROTOCOL_INVESTIGATION_BODY_MAX_CHARS:-200000}"
      ULTRAFV3_ORDER_PROTOCOL_TEST_ENABLED: "${ULTRAFV3_ORDER_PROTOCOL_TEST_ENABLED:-false}"
      FEATURE_ERP_INVESTIGATION: "${FEATURE_ERP_INVESTIGATION:-false}"
      COMMUNICATIONS_ENABLED: "${COMMUNICATIONS_ENABLED:-false}"
      WHATSAPP_INTEGRATION_ENABLED: "${WHATSAPP_INTEGRATION_ENABLED:-false}"
      WHATSAPP_PROVIDER: "${WHATSAPP_PROVIDER:-meta}"
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: "${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}"
      WHATSAPP_APP_SECRET: "${WHATSAPP_APP_SECRET:-}"
      WHATSAPP_ACCESS_TOKEN: "${WHATSAPP_ACCESS_TOKEN:-}"
      WHATSAPP_PHONE_NUMBER_ID: "${WHATSAPP_PHONE_NUMBER_ID:-}"
      WHATSAPP_BUSINESS_ACCOUNT_ID: "${WHATSAPP_BUSINESS_ACCOUNT_ID:-}"
      WHATSAPP_API_VERSION: "${WHATSAPP_API_VERSION:-v20.0}"
      COMMUNICATIONS_WEBHOOK_RETENTION_DAYS: "${COMMUNICATIONS_WEBHOOK_RETENTION_DAYS:-30}"
    ports: ["127.0.0.1:4000:4000"]
    restart: unless-stopped
    networks: [production]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  web:
    image: "${WEB_IMAGE:?WEB_IMAGE is required and must identify the planned WEB release}"
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
        APP_COMMIT: "${APP_COMMIT:?APP_COMMIT is required}"
        APP_VERSION: "${APP_VERSION:?APP_VERSION is required}"
        APP_BUILT_AT: "${APP_BUILT_AT:?APP_BUILT_AT is required}"
    ports: ["127.0.0.1:5173:80"]
    restart: unless-stopped
    networks: [production]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  production:
    external: true
    name: gest-o_default
