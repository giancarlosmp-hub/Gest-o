name: ${COMPOSE_PROJECT_NAME}

services:
  db:
    labels: &preview_labels
      com.gesto.preview: "true"
      com.gesto.preview.pr: ${PREVIEW_OWNER_PR:?PREVIEW_OWNER_PR is required}
      com.gesto.preview.run-id: ${PREVIEW_OWNER_RUN_ID:?PREVIEW_OWNER_RUN_ID is required}
      com.gesto.preview.run-attempt: ${PREVIEW_OWNER_RUN_ATTEMPT:?PREVIEW_OWNER_RUN_ATTEMPT is required}
      com.gesto.preview.workflow: ${PREVIEW_OWNER_WORKFLOW:?PREVIEW_OWNER_WORKFLOW is required}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-salesforce_pro_preview}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-salesforce_pro_preview}"]

  api:
    labels: *preview_labels
    environment:
      NODE_ENV: production
      DATABASE_SCHEMA_MODE: ephemeral-push
      DEPLOYMENT_ENV: ${DEPLOYMENT_ENV:-preview}
      TENANCY_MODE: ${TENANCY_MODE:-disabled}
      TENANT_READ_PILOT_ENABLED: ${TENANT_READ_PILOT_ENABLED:-false}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}@db:5432/${POSTGRES_DB:-salesforce_pro_preview}?schema=public}
      SEED_ON_BOOTSTRAP: ${SEED_ON_BOOTSTRAP:-false}
      ENABLE_SMOKE_BOOTSTRAP: ${ENABLE_SMOKE_BOOTSTRAP:-false}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-true}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_ROLE: ${ADMIN_BOOTSTRAP_ROLE:-}
      ADMIN_BOOTSTRAP_REGION: ${ADMIN_BOOTSTRAP_REGION:-}

  web:
    labels: *preview_labels

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME}
    labels: *preview_labels

networks:
  default:
    labels: *preview_labels
