name: Production Deploy Safety

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  production-deploy-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Production deploy safety tests (fake Docker, no remote access)
        run: npm run test:production-deploy
