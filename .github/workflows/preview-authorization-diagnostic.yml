name: Preview Authorization Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: preview-pr-881
  cancel-in-progress: false

jobs:
  authorize-exact-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "PREVIEW_AUTH_DIAGNOSTIC_RESULT=ERROR reason=ref_must_be_main observed=${GITHUB_REF}"
            exit 1
          fi

      - name: Checkout the dispatched main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Record trusted code SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          echo "PREVIEW_AUTH_DIAGNOSTIC_CODE_SHA=${GITHUB_SHA}"

      - name: Copy trusted authorization files to an isolated VPS directory
        id: copy
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22022
          source: scripts/preview-image-lifecycle.mjs,scripts/preview-authorization-diagnostic-remote.sh
          target: /tmp/gesto-preview-authorization-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Authorize exact PR 881 candidate (read-only)
        id: authorize
        if: always()
        continue-on-error: true
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: giancarlosmp-hub/Gest-o
          PREVIEW_OWNER_REPOSITORY: giancarlosmp-hub/Gest-o
          PREVIEW_OWNER_PR: "881"
          PREVIEW_OWNER_RUN_ID: "35668904948"
          PREVIEW_OWNER_RUN_ATTEMPT: "1"
          PREVIEW_OWNER_WORKFLOW: Preview-Deploy
          EXPECTED_PREVIEW_SHA: ef1bd1069cb23e1e887aef7154d94fae8879797e
          COMPOSE_PROJECT_NAME: gesto-pr-881-35668904948-1
          DIAGNOSTIC_MANIFEST: /var/www/preview-provenance/gesto-pr-881-35668904948-1.json
          DIAGNOSTIC_TEMP_DIR: /tmp/gesto-preview-authorization-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          DIAGNOSTIC_CODE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          key_file=$(mktemp)
          request_file=$(mktemp)
          remote_output=$(mktemp)
          cleanup_local() { rm -f -- "$key_file" "$request_file" "$remote_output"; }
          trap cleanup_local EXIT
          chmod 600 "$key_file" "$request_file" "$remote_output"
          printf '%s\n' "$VPS_KEY" > "$key_file"
          {
            for name in GITHUB_TOKEN GITHUB_REPOSITORY PREVIEW_OWNER_REPOSITORY PREVIEW_OWNER_PR PREVIEW_OWNER_RUN_ID PREVIEW_OWNER_RUN_ATTEMPT PREVIEW_OWNER_WORKFLOW EXPECTED_PREVIEW_SHA COMPOSE_PROJECT_NAME DIAGNOSTIC_MANIFEST DIAGNOSTIC_TEMP_DIR DIAGNOSTIC_CODE_SHA; do
              printf 'export %s=%q\n' "$name" "${!name}"
            done
            printf '%s\n' 'bash "$DIAGNOSTIC_TEMP_DIR/scripts/preview-authorization-diagnostic-remote.sh"'
          } > "$request_file"
          set +e
          ssh -i "$key_file" -p 22022 \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            -- "$VPS_USER@$VPS_HOST" 'bash -s' < "$request_file" > "$remote_output"
          ssh_rc=$?
          set -e
          node scripts/preview-authorization-diagnostic-result.mjs "$remote_output" "$ssh_rc" "$GITHUB_OUTPUT"
          exit "$ssh_rc"

      - name: Publish non-destructive diagnostic summary
        if: always()
        shell: bash
        env:
          AUTHORIZATION_OUTCOME: ${{ steps.authorize.outcome }}
          RESULT: ${{ steps.authorize.outputs.result }}
          REASON: ${{ steps.authorize.outputs.reason }}
          FIELD: ${{ steps.authorize.outputs.field }}
          AUTHORIZE_EXIT_CODE: ${{ steps.authorize.outputs.authorize_exit_code }}
          TEMPORARY_CLEANUP: ${{ steps.authorize.outputs.temporary_cleanup }}
          SSH_EXIT_CODE: ${{ steps.authorize.outputs.ssh_exit_code }}
        run: |
          result=${RESULT:-ERROR}
          reason=${REASON:-transport_step_did_not_produce_result}
          field=${FIELD:-NOT_AVAILABLE}
          authorize_exit=${AUTHORIZE_EXIT_CODE:-NOT_EXECUTED}
          temporary_cleanup=${TEMPORARY_CLEANUP:-NOT_PROVEN}
          ssh_exit=${SSH_EXIT_CODE:-UNKNOWN}
          {
            echo '## Preview Authorization Diagnostic'
            echo
            echo "- Code SHA: \`${GITHUB_SHA}\`"
            echo '- Project: `gesto-pr-881-35668904948-1`'
            echo '- PR / run / attempt: `881 / 35668904948 / 1`'
            echo "- Step outcome: \`${AUTHORIZATION_OUTCOME}\`"
            echo "- Result: \`${result}\`"
            echo "- Reason: \`${reason}\`"
            echo "- Divergent field: \`${field}\`"
            echo "- Authorize exit code: \`${authorize_exit}\`"
            echo "- SSH exit code: \`${ssh_exit}\`"
            echo '- Resource cleanup executed: **NO**.'
            echo "- Temporary diagnostic files: \`${temporary_cleanup}\`"
          } >> "$GITHUB_STEP_SUMMARY"
