name: Preview Deploy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: preview
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}-crm.demetraagronegocios.com.br
      PREVIEW_URL_HTTP: http://pr-${{ github.event.pull_request.number }}.crm.demetraagronegocios.com.br
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      PREVIEW_OWNER_PR: ${{ github.event.pull_request.number }}
      PREVIEW_OWNER_RUN_ID: ${{ github.run_id }}
      PREVIEW_OWNER_RUN_ATTEMPT: ${{ github.run_attempt }}
      PREVIEW_OWNER_WORKFLOW: Preview-Deploy
      EXPECTED_PREVIEW_SHA: ${{ github.sha }}
      COMPOSE_PROJECT_NAME: gesto-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: salesforce_pro_preview_pr_${{ github.event.pull_request.number }}_${{ github.run_id }}_${{ github.run_attempt }}
      POSTGRES_VOLUME_NAME: gesto_pgdata_pr_${{ github.event.pull_request.number }}_${{ github.run_id }}_${{ github.run_attempt }}
      API_PORT: 0
      WEB_PORT: 0
    steps:
      - name: Encode preview credential for SSH transport
        id: preview-credential
        shell: bash
        env:
          PREVIEW_AUTH_PASSWORD: ${{ secrets.PREVIEW_AUTH_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_AUTH_PASSWORD:-}" ]; then
            echo "PREVIEW_PASSWORD_PRESENT=NO"
            exit 1
          fi
          encoded=$(printf '%s' "$PREVIEW_AUTH_PASSWORD" | base64 -w 0)
          echo "::add-mask::$encoded"
          printf 'password_b64=%s\n' "$encoded" >> "$GITHUB_OUTPUT"

      - name: Deploy preview on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          PREVIEW_OWNER_PR: ${{ github.event.pull_request.number }}
          PREVIEW_OWNER_RUN_ID: ${{ github.run_id }}
          PREVIEW_OWNER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PREVIEW_OWNER_WORKFLOW: Preview-Deploy
          EXPECTED_PREVIEW_SHA: ${{ github.sha }}
          COMPOSE_PROJECT_NAME: gesto-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: salesforce_pro_preview_pr_${{ github.event.pull_request.number }}_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_VOLUME_NAME: gesto_pgdata_pr_${{ github.event.pull_request.number }}_${{ github.run_id }}_${{ github.run_attempt }}
          API_PORT: 0
          WEB_PORT: 0
          PREVIEW_AUTH_PASSWORD_B64: ${{ steps.preview-credential.outputs.password_b64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22022
          script_stop: true
          envs: PR_NUMBER,PR_BRANCH,GITHUB_REPOSITORY,GITHUB_TOKEN,COMPOSE_PROJECT_NAME,POSTGRES_DB,POSTGRES_VOLUME_NAME,API_PORT,WEB_PORT,PREVIEW_AUTH_PASSWORD_B64,PREVIEW_OWNER_PR,PREVIEW_OWNER_RUN_ID,PREVIEW_OWNER_RUN_ATTEMPT,PREVIEW_OWNER_WORKFLOW,EXPECTED_PREVIEW_SHA
          script: |
            set -eu
            PREVIEW_DIR="/var/www/preview/pr-${PR_NUMBER}/${COMPOSE_PROJECT_NAME}"
            rm -rf "$PREVIEW_DIR"
            mkdir -p "$PREVIEW_DIR"
            git clone --depth 1 --branch "$PR_BRANCH" "https://github.com/${GITHUB_REPOSITORY}.git" "$PREVIEW_DIR"
            cd "$PREVIEW_DIR"
            git fetch --depth 1 origin "pull/${PR_NUMBER}/merge"
            git checkout --detach "$EXPECTED_PREVIEW_SHA"
            test "$(git rev-parse HEAD)" = "$EXPECTED_PREVIEW_SHA"
            exec bash scripts/deploy/preview-remote.sh

      - name: Comment preview link on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚀 Preview environment updated.

            Preview URL (HTTPS): ${{ env.PREVIEW_URL }}
            Preview URL (HTTP fallback): ${{ env.PREVIEW_URL_HTTP }}
            Banco do preview é isolado e populado com dados fictícios via ENABLE_PREVIEW_SEED=true.
            Acesso sintético: usuário pr${{ github.event.pull_request.number }}@preview.local e senha PREVIEW_AUTH_PASSWORD do GitHub Environment `preview`. Obtenha a senha com o proprietário pelo gerenciador privado; ela não é publicada aqui.
