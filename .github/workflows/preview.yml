name: Preview Deploy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: preview
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BRANCH: ${{ github.event.pull_request.head.ref }}
      PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}-crm.demetraagronegocios.com.br
      PREVIEW_URL_HTTP: http://pr-${{ github.event.pull_request.number }}.crm.demetraagronegocios.com.br
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      PREVIEW_OWNER_PR: ${{ github.event.pull_request.number }}
      PREVIEW_OWNER_RUN_ID: ${{ github.run_id }}
      PREVIEW_OWNER_RUN_ATTEMPT: ${{ github.run_attempt }}
      PREVIEW_OWNER_WORKFLOW: Preview-Deploy
      COMPOSE_PROJECT_NAME: gesto-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: salesforce_pro_preview_pr_${{ github.event.pull_request.number }}_${{ github.run_id }}_${{ github.run_attempt }}
      POSTGRES_VOLUME_NAME: gesto_pgdata_pr_${{ github.event.pull_request.number }}_${{ github.run_id }}_${{ github.run_attempt }}
      API_PORT: 0
      WEB_PORT: 0
      ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.PREVIEW_AUTH_EMAIL }}
      ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.PREVIEW_AUTH_PASSWORD }}

    steps:
      - name: Deploy preview on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          PREVIEW_OWNER_PR: ${{ github.event.pull_request.number }}
          PREVIEW_OWNER_RUN_ID: ${{ github.run_id }}
          PREVIEW_OWNER_RUN_ATTEMPT: ${{ github.run_attempt }}
          PREVIEW_OWNER_WORKFLOW: Preview-Deploy
          COMPOSE_PROJECT_NAME: gesto-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: salesforce_pro_preview_pr_${{ github.event.pull_request.number }}_${{ github.run_id }}_${{ github.run_attempt }}
          POSTGRES_VOLUME_NAME: gesto_pgdata_pr_${{ github.event.pull_request.number }}_${{ github.run_id }}_${{ github.run_attempt }}
          API_PORT: 0
          WEB_PORT: 0
          ADMIN_BOOTSTRAP_EMAIL: ${{ secrets.PREVIEW_AUTH_EMAIL }}
          ADMIN_BOOTSTRAP_PASSWORD: ${{ secrets.PREVIEW_AUTH_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22022
          script_stop: true
          envs: PR_NUMBER,PR_BRANCH,GITHUB_REPOSITORY,GITHUB_TOKEN,COMPOSE_PROJECT_NAME,POSTGRES_DB,POSTGRES_VOLUME_NAME,API_PORT,WEB_PORT,ADMIN_BOOTSTRAP_EMAIL,ADMIN_BOOTSTRAP_PASSWORD,PREVIEW_OWNER_PR,PREVIEW_OWNER_RUN_ID,PREVIEW_OWNER_RUN_ATTEMPT,PREVIEW_OWNER_WORKFLOW
          script: |
            set -euo pipefail

            [ -n "${ADMIN_BOOTSTRAP_EMAIL:-}" ] && [ -n "${ADMIN_BOOTSTRAP_PASSWORD:-}" ] || {
              echo "PREVIEW_CREDENTIAL_CONFIGURATION=MISSING"
              exit 1
            }
            [[ "$ADMIN_BOOTSTRAP_EMAIL" =~ ^[A-Za-z0-9._+@-]{3,160}$ && "$ADMIN_BOOTSTRAP_PASSWORD" =~ ^[A-Za-z0-9._+@-]{16,160}$ ]] || {
              echo "PREVIEW_CREDENTIAL_CONFIGURATION=INVALID_FORMAT"
              exit 1
            }

            PREVIEW_DIR="/var/www/preview/pr-${PR_NUMBER}/${COMPOSE_PROJECT_NAME}"
            PREVIEW_HOST_TLS="pr-${PR_NUMBER}-crm.demetraagronegocios.com.br"
            PREVIEW_HOST_HTTP="pr-${PR_NUMBER}.crm.demetraagronegocios.com.br"

            if [ -d "$PREVIEW_DIR" ]; then
              rm -rf "$PREVIEW_DIR"
            fi

            mkdir -p "$PREVIEW_DIR"
            cd "$PREVIEW_DIR"

            git clone --depth 1 --branch "${PR_BRANCH}" "https://github.com/${GITHUB_REPOSITORY}.git" .
            git checkout "${PR_BRANCH}"

            cat > .env <<ENVFILE
            COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME}
            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_VOLUME_NAME=${POSTGRES_VOLUME_NAME}
            DATABASE_SCHEMA_MODE=ephemeral-push
            ADMIN_BOOTSTRAP_ENABLED=true
            ADMIN_BOOTSTRAP_NAME=Admin Preview PR ${PR_NUMBER}
            ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL}
            ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD}
            ADMIN_BOOTSTRAP_ROLE=diretor
            ADMIN_BOOTSTRAP_REGION=Nacional
            SEED_ON_BOOTSTRAP=false
            ENABLE_SMOKE_BOOTSTRAP=false
            ENABLE_PREVIEW_SEED=true
            DEPLOYMENT_ENV=preview
            TENANCY_MODE=disabled
            TENANT_READ_PILOT_ENABLED=false
            DEFAULT_TENANT_ID=tenant-default-v1
            FRONTEND_URL=https://pr-${PR_NUMBER}-crm.demetraagronegocios.com.br
            CORS_ALLOWED_ORIGINS=https://pr-${PR_NUMBER}-crm.demetraagronegocios.com.br,http://pr-${PR_NUMBER}.crm.demetraagronegocios.com.br,https://pr-${PR_NUMBER}.crm.demetraagronegocios.com.br
            VITE_API_URL=/api
            WEB_PORT=0
            API_PORT=0
            ENVFILE

            export COMPOSE_PROJECT_NAME
            export POSTGRES_DB
            export POSTGRES_VOLUME_NAME
            export API_PORT=0
            export WEB_PORT=0
            export ADMIN_BOOTSTRAP_EMAIL
            export ADMIN_BOOTSTRAP_PASSWORD

            validate_current_run_ownership() {
              ids="$(docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml ps -aq)"
              for id in $ids; do
                [ "$(docker inspect -f '{{ index .Config.Labels "com.gesto.preview.pr" }}' "$id")" = "$PREVIEW_OWNER_PR" ]
                [ "$(docker inspect -f '{{ index .Config.Labels "com.gesto.preview.run-id" }}' "$id")" = "$PREVIEW_OWNER_RUN_ID" ]
                [ "$(docker inspect -f '{{ index .Config.Labels "com.gesto.preview.run-attempt" }}' "$id")" = "$PREVIEW_OWNER_RUN_ATTEMPT" ]
                [ "$(docker inspect -f '{{ index .Config.Labels "com.gesto.preview.workflow" }}' "$id")" = "$PREVIEW_OWNER_WORKFLOW" ]
              done
              network_name="${COMPOSE_PROJECT_NAME}_default"
              if docker network inspect "$network_name" >/dev/null 2>&1; then
                [ "$(docker network inspect -f '{{ index .Labels "com.gesto.preview.pr" }}' "$network_name")" = "$PREVIEW_OWNER_PR" ]
                [ "$(docker network inspect -f '{{ index .Labels "com.gesto.preview.run-id" }}' "$network_name")" = "$PREVIEW_OWNER_RUN_ID" ]
                [ "$(docker network inspect -f '{{ index .Labels "com.gesto.preview.workflow" }}' "$network_name")" = "$PREVIEW_OWNER_WORKFLOW" ]
              fi
              if docker volume inspect "$POSTGRES_VOLUME_NAME" >/dev/null 2>&1; then
                [ "$(docker volume inspect -f '{{ index .Labels "com.gesto.preview.pr" }}' "$POSTGRES_VOLUME_NAME")" = "$PREVIEW_OWNER_PR" ]
                [ "$(docker volume inspect -f '{{ index .Labels "com.gesto.preview.run-id" }}' "$POSTGRES_VOLUME_NAME")" = "$PREVIEW_OWNER_RUN_ID" ]
                [ "$(docker volume inspect -f '{{ index .Labels "com.gesto.preview.workflow" }}' "$POSTGRES_VOLUME_NAME")" = "$PREVIEW_OWNER_WORKFLOW" ]
              fi
            }
            cleanup_current_run_on_failure() {
              rc="$?"
              if [ "$rc" -ne 0 ]; then
                if validate_current_run_ownership; then
                  docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml down -v --remove-orphans
                fi
                nginx_site="/etc/nginx/sites-available/crm-preview-pr-${PR_NUMBER}"
                if sudo test -f "$nginx_site" && sudo grep -Fq "owner-run=${PREVIEW_OWNER_RUN_ID} owner-attempt=${PREVIEW_OWNER_RUN_ATTEMPT}" "$nginx_site"; then
                  sudo rm -f "/etc/nginx/sites-enabled/crm-preview-pr-${PR_NUMBER}" "$nginx_site"
                  sudo nginx -t
                  sudo systemctl reload nginx
                fi
                rm -rf "$PREVIEW_DIR"
              fi
              exit "$rc"
            }
            trap cleanup_current_run_on_failure EXIT

            docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml up -d --build
            validate_current_run_ownership
            API_PORT="$(docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml port api 4000 | awk -F: 'NR==1{print $NF}')"
            WEB_PORT="$(docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml port web 80 | awk -F: 'NR==1{print $NF}')"
            [[ "$API_PORT" =~ ^[0-9]+$ && "$WEB_PORT" =~ ^[0-9]+$ ]]
            export API_PORT WEB_PORT
            sed -i "s/^API_PORT=0$/API_PORT=${API_PORT}/; s/^WEB_PORT=0$/WEB_PORT=${WEB_PORT}/" .env
            NGINX_RENDERED="$(mktemp)"
            sed -e "s/__PREVIEW_HOST_TLS__/${PREVIEW_HOST_TLS}/g" -e "s/__PREVIEW_HOST_HTTP__/${PREVIEW_HOST_HTTP}/g" -e "s/__PREVIEW_WEB_PORT__/${WEB_PORT}/g" -e "s/__PREVIEW_OWNER_PR__/${PREVIEW_OWNER_PR}/g" -e "s/__PREVIEW_OWNER_RUN_ID__/${PREVIEW_OWNER_RUN_ID}/g" -e "s/__PREVIEW_OWNER_RUN_ATTEMPT__/${PREVIEW_OWNER_RUN_ATTEMPT}/g" docs/ops/nginx-crm-preview.conf > "$NGINX_RENDERED"
            sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled
            sudo install -m 644 "$NGINX_RENDERED" "/etc/nginx/sites-available/crm-preview-pr-${PR_NUMBER}"
            rm -f "$NGINX_RENDERED"
            sudo ln -sfn "/etc/nginx/sites-available/crm-preview-pr-${PR_NUMBER}" "/etc/nginx/sites-enabled/crm-preview-pr-${PR_NUMBER}"
            sudo nginx -t
            sudo systemctl reload nginx
            docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml ps

            API_HEALTHY=false
            for i in {1..60}; do
              if ! STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${API_PORT}/health"); then STATUS=000; fi
              if [ "$STATUS" = "200" ]; then
                echo "API healthy"
                API_HEALTHY=true
                break
              fi
              sleep 2
            done

            if [ "$API_HEALTHY" != "true" ]; then
              echo "API did not become healthy in time"
              docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml logs api --tail=200
              exit 1
            fi

            WEB_HEALTHY=false
            for i in {1..60}; do
              if ! STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${WEB_PORT}/healthz"); then STATUS=000; fi
              if [ "$STATUS" = "200" ]; then
                echo "WEB healthy"
                WEB_HEALTHY=true
                break
              fi
              sleep 2
            done

            if [ "$WEB_HEALTHY" != "true" ]; then
              echo "WEB did not become healthy in time"
              docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml logs web --tail=200
              docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml logs api --tail=200
              exit 1
            fi

            if ! PROXY_HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: ${PREVIEW_HOST_HTTP}" "http://127.0.0.1/"); then PROXY_HTTP_STATUS=000; fi
            if ! PROXY_HTTPS_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" --resolve "${PREVIEW_HOST_TLS}:443:127.0.0.1" "https://${PREVIEW_HOST_TLS}/"); then PROXY_HTTPS_STATUS=000; fi
            echo "Proxy HTTP status: ${PROXY_HTTP_STATUS}"
            echo "Proxy HTTPS status: ${PROXY_HTTPS_STATUS}"

            if [ "${PROXY_HTTP_STATUS}" != "200" ] || [ "${PROXY_HTTPS_STATUS}" != "200" ]; then
              echo "Reverse proxy check failed"
              docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml logs web --tail=200
              docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml logs api --tail=200
              sudo tail -n 200 /var/log/nginx/preview_error.log
              exit 1
            fi

            echo "=== BOOTSTRAP ADMIN ==="
            docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml exec -T api \
              node apps/api/dist/scripts/adminEnsureUser.js \
              --name "Admin Preview PR ${PR_NUMBER}" \
              --email "${ADMIN_BOOTSTRAP_EMAIL}" \
              --password "${ADMIN_BOOTSTRAP_PASSWORD}" \
              --role "diretor" \
              --region "Nacional"
            echo "Bootstrap executed"
            echo "Admin ensured"

            echo "=== PREVIEW SEED ==="
            docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml exec -T \
              -e ENABLE_PREVIEW_SEED=true \
              -e NODE_ENV=development \
              -e PREVIEW_SEED_PASSWORD="${ADMIN_BOOTSTRAP_PASSWORD}" \
              api npm run seed:preview -w @salesforce-pro/api

            echo "TENANT_READ_PREVIEW_SEED=PASS"
            echo "=== CERTIFY PREVIEW DATASET ==="
            docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml exec -T \
              -e NODE_ENV=test -e DEPLOYMENT_ENV=preview -e DEFAULT_TENANT_ID=tenant-default-v1 \
              api npx tsx apps/api/prisma/validatePreviewTenantReadPilot.ts
            echo "TENANT_READ_PREVIEW_DATASET=PASS"

            # Enable only after seed certification. Normal failures use fail_shadow_proof; EXIT is emergency-only.
            LOGIN_FILE="$(mktemp)"; LOGIN_HTTP_FILE="$(mktemp)"; SHADOW_LOG="$(mktemp)"; RESULT_DIR="$(mktemp -d)"
            PILOT_ACTIVATED=false
            ROLLBACK_ATTEMPTED=false
            STABILITY_CYCLES=10
            REQUESTS_PER_CYCLE=4
            PLANNED_REQUESTS=$((STABILITY_CYCLES * REQUESTS_PER_CYCLE))
            COMPLETED_CYCLES=0
            COMPLETED_REQUESTS=0
            HTTP_200_COUNT=0
            MATCH_COUNT=0
            MISMATCH_COUNT=0
            MISSING_ID_COUNT=0
            DUPLICATE_ID_COUNT=0
            STABILITY_RUN_ID="stability-$(date -u +%Y%m%dT%H%M%SZ)-$$"
            STABILITY_STARTED_EPOCH="$(date +%s)"

            rollback_preview_pilot() {
              ROLLBACK_ATTEMPTED=true
              sed -i 's/^TENANCY_MODE=default-only$/TENANCY_MODE=disabled/; s/^TENANT_READ_PILOT_ENABLED=true$/TENANT_READ_PILOT_ENABLED=false/' .env
              if docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml up -d --no-deps --force-recreate api >/dev/null 2>&1; then
                PILOT_ACTIVATED=false
                echo "TENANT_READ_PREVIEW_ROLLBACK=PASS"
                return 0
              fi
              echo "TENANT_READ_PREVIEW_ROLLBACK=ERROR stage=api_recreate"
              return 1
            }

            print_shadow_diagnostic() {
              echo "loginStatus=${LOGIN_HTTP_STATUS:-unavailable} loginExitCode=${LOGIN_CURL_EXIT:-unavailable} tokenExitCode=${TOKEN_EXTRACTION_EXIT:-unavailable}"
              for request in $(seq 1 "$PLANNED_REQUESTS"); do
                cycle=$(( (request - 1) / REQUESTS_PER_CYCLE + 1 ))
                index=$(( (request - 1) % REQUESTS_PER_CYCLE + 1 ))
                request_id="unavailable"; status="unavailable"; exit_code="unavailable"; event_count="unavailable"
                if [ -f "${RESULT_DIR}/${request}.request-id" ]; then request_id="$(cat "${RESULT_DIR}/${request}.request-id")"; fi
                if [ -f "${RESULT_DIR}/${request}.status" ]; then status="$(cat "${RESULT_DIR}/${request}.status")"; fi
                if [ -f "${RESULT_DIR}/${request}.exit" ]; then exit_code="$(cat "${RESULT_DIR}/${request}.exit")"; fi
                if [ -f "${RESULT_DIR}/${request}.events" ]; then event_count="$(cat "${RESULT_DIR}/${request}.events")"; fi
                echo "cycle=${cycle} index=${index} requestId=${request_id} status=${status} exitCode=${exit_code} eventCount=${event_count}"
              done
              echo "MATCH_COUNT=${MATCH_COUNT:-0} MISMATCH_COUNT=${MISMATCH_COUNT:-0}"
              if [ -s "$SHADOW_LOG" ]; then
                for request in $(seq 1 "$PLANNED_REQUESTS"); do
                  if [ -f "${RESULT_DIR}/${request}.request-id" ]; then
                    returned_id="$(cat "${RESULT_DIR}/${request}.request-id")"
                    awk -v id="\"requestId\":\"${returned_id}\"" 'index($0,"TENANT_READ_SHADOW_EVENT=") && index($0,id)' "$SHADOW_LOG"
                  fi
                done
              fi
            }

            fail_shadow_proof() {
              stage="$1"
              failed_duration=$(( $(date +%s) - STABILITY_STARTED_EPOCH ))
              echo "TENANT_READ_PREVIEW_FAILURE_STAGE=${stage}"
              print_shadow_diagnostic
              echo "TENANT_READ_PREVIEW_STABILITY={\"runId\":\"${STABILITY_RUN_ID}\",\"cyclesPlanned\":${STABILITY_CYCLES},\"cyclesCompleted\":${COMPLETED_CYCLES},\"requestsPlanned\":${PLANNED_REQUESTS},\"requestsCompleted\":${COMPLETED_REQUESTS},\"http200Total\":${HTTP_200_COUNT},\"matchTotal\":${MATCH_COUNT},\"mismatchTotal\":${MISMATCH_COUNT},\"missingIds\":${MISSING_ID_COUNT},\"duplicateIds\":${DUPLICATE_ID_COUNT},\"durationSeconds\":${failed_duration},\"result\":\"FAIL\"}"
              if ! rollback_preview_pilot; then
                echo "TENANT_READ_PREVIEW_FAILURE_STAGE=${stage}_rollback"
              fi
              exit 1
            }

            emergency_shadow_cleanup() {
              rc="$?"
              if [ "$rc" -ne 0 ] && [ "$PILOT_ACTIVATED" = "true" ] && [ "$ROLLBACK_ATTEMPTED" != "true" ]; then
                echo "TENANT_READ_PREVIEW_FAILURE_STAGE=emergency_exit"
                print_shadow_diagnostic
                if ! rollback_preview_pilot; then echo "TENANT_READ_PREVIEW_ROLLBACK=ERROR stage=emergency"; fi
              fi
              rm -f "$LOGIN_FILE" "$LOGIN_HTTP_FILE" "$SHADOW_LOG"
              rm -rf "$RESULT_DIR"
              if [ "$rc" -ne 0 ]; then
                if validate_current_run_ownership; then
                  docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml down -v --remove-orphans
                fi
                nginx_site="/etc/nginx/sites-available/crm-preview-pr-${PR_NUMBER}"
                if sudo test -f "$nginx_site" && sudo grep -Fq "owner-run=${PREVIEW_OWNER_RUN_ID} owner-attempt=${PREVIEW_OWNER_RUN_ATTEMPT}" "$nginx_site"; then
                  sudo rm -f "/etc/nginx/sites-enabled/crm-preview-pr-${PR_NUMBER}" "$nginx_site"
                  sudo nginx -t
                  sudo systemctl reload nginx
                fi
                rm -rf "$PREVIEW_DIR"
              fi
              exit "$rc"
            }
            trap emergency_shadow_cleanup EXIT

            sed -i 's/^TENANCY_MODE=disabled$/TENANCY_MODE=default-only/; s/^TENANT_READ_PILOT_ENABLED=false$/TENANT_READ_PILOT_ENABLED=true/' .env
            PILOT_ACTIVATED=true
            if ! docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml up -d --no-deps --force-recreate api; then fail_shadow_proof activation; fi
            API_CONTAINER_ID="$(docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml ps -q api)"
            if [ -z "$API_CONTAINER_ID" ]; then fail_shadow_proof activation; fi
            API_RECREATED_HEALTHY=false
            for i in {1..60}; do
              if [ "$(docker inspect --format='{{.State.Health.Status}}' "$API_CONTAINER_ID")" = "healthy" ]; then API_RECREATED_HEALTHY=true; break; fi
              sleep 2
            done
            if [ "$API_RECREATED_HEALTHY" != "true" ]; then fail_shadow_proof activation_health; fi
            if ! docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml exec -T api node -e \
              'if(process.env.DEPLOYMENT_ENV!=="preview"||process.env.TENANCY_MODE!=="default-only"||process.env.TENANT_READ_PILOT_ENABLED!=="true"||process.env.DEFAULT_TENANT_ID!=="tenant-default-v1")process.exit(1)'; then fail_shadow_proof activation_config; fi

            echo "=== REAL GET /clients SHADOW PROOF ==="
            if curl -sS -o "$LOGIN_FILE" -w '%{http_code}' -X POST "http://127.0.0.1:${API_PORT}/auth/login" \
              -H "Content-Type: application/json" --data "{\"email\":\"${ADMIN_BOOTSTRAP_EMAIL}\",\"password\":\"${ADMIN_BOOTSTRAP_PASSWORD}\"}" > "$LOGIN_HTTP_FILE"; then
              LOGIN_CURL_EXIT=0
            else
              LOGIN_CURL_EXIT="$?"
            fi
            LOGIN_HTTP_STATUS="$(cat "$LOGIN_HTTP_FILE")"
            echo "TENANT_READ_PREVIEW_LOGIN_HTTP=${LOGIN_HTTP_STATUS:-unavailable}"
            if [ "$LOGIN_CURL_EXIT" != "0" ] || [ "$LOGIN_HTTP_STATUS" != "200" ]; then fail_shadow_proof login; fi

            if TOKEN="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(typeof x.accessToken!=="string"||!x.accessToken)process.exit(1);process.stdout.write(x.accessToken)' "$LOGIN_FILE" 2>/dev/null)" && [ -n "$TOKEN" ]; then
              TOKEN_EXTRACTION_EXIT=0
              echo "TENANT_READ_PREVIEW_TOKEN=ACQUIRED"
            else
              TOKEN_EXTRACTION_EXIT="$?"
              TOKEN=""
              fail_shadow_proof token_extraction
            fi

            SHADOW_SINCE="$(date -u +%FT%TZ)"
            declare -A SEEN_REQUEST_IDS=()
            for cycle in $(seq 1 "$STABILITY_CYCLES"); do
              PIDS=()
              for index in $(seq 1 "$REQUESTS_PER_CYCLE"); do
                request=$(( (cycle - 1) * REQUESTS_PER_CYCLE + index ))
                curl --max-time 15 -sS -D "${RESULT_DIR}/${request}.headers" -o /dev/null -w '%{http_code}' \
                  -H "Authorization: Bearer ${TOKEN}" "http://127.0.0.1:${API_PORT}/clients" \
                  > "${RESULT_DIR}/${request}.status" &
                PIDS+=("$!")
              done
              for index in $(seq 1 "$REQUESTS_PER_CYCLE"); do
                request=$(( (cycle - 1) * REQUESTS_PER_CYCLE + index ))
                if wait "${PIDS[$((index - 1))]}"; then
                  printf '0\n' > "${RESULT_DIR}/${request}.exit"
                else
                  printf '%s\n' "$?" > "${RESULT_DIR}/${request}.exit"
                fi
                status="$(cat "${RESULT_DIR}/${request}.status")"
                exit_code="$(cat "${RESULT_DIR}/${request}.exit")"
                if [ "$status" != "200" ] || [ "$exit_code" != "0" ]; then fail_shadow_proof request; fi
                HTTP_200_COUNT=$((HTTP_200_COUNT + 1))
                COMPLETED_REQUESTS=$((COMPLETED_REQUESTS + 1))

                header_count="$(awk 'tolower($1)=="x-request-id:"{n++} END{print n+0}' "${RESULT_DIR}/${request}.headers")"
                if [ "$header_count" != "1" ]; then MISSING_ID_COUNT=$((MISSING_ID_COUNT + 1)); fail_shadow_proof response_request_id; fi
                returned_id="$(awk 'tolower($1)=="x-request-id:"{gsub(/\r/,"",$2); print $2}' "${RESULT_DIR}/${request}.headers")"
                if [[ ! "$returned_id" =~ ^req-[0-9a-f]{8}$ ]]; then MISSING_ID_COUNT=$((MISSING_ID_COUNT + 1)); fail_shadow_proof response_request_id; fi
                if [ "${SEEN_REQUEST_IDS[$returned_id]+present}" = "present" ]; then DUPLICATE_ID_COUNT=$((DUPLICATE_ID_COUNT + 1)); fail_shadow_proof response_request_id; fi
                SEEN_REQUEST_IDS["$returned_id"]=1
                printf '%s\n' "$returned_id" > "${RESULT_DIR}/${request}.request-id"
              done
              COMPLETED_CYCLES=$((COMPLETED_CYCLES + 1))
            done
            if [ "${#SEEN_REQUEST_IDS[@]}" != "$PLANNED_REQUESTS" ]; then fail_shadow_proof response_request_id; fi
            echo "TENANT_READ_PREVIEW_REQUESTS=WAITED"
            echo "TENANT_READ_PREVIEW_REQUEST_IDS=ACQUIRED"

            # Bound the evidence to this run's timestamps and returned internal IDs. A few short
            # retries tolerate container log delivery delay without turning preview into a long soak.
            SHADOW_UNTIL="$(date -u -d '+1 second' +%FT%TZ)"
            EVENTS_COMPLETE=false
            for log_attempt in 1 2 3 4 5; do
              if ! docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.yml -f docker-compose.preview.yml \
                logs --since "$SHADOW_SINCE" --until "$SHADOW_UNTIL" api > "$SHADOW_LOG"; then
                fail_shadow_proof requests_or_events
              fi
              observed=0
              for request in $(seq 1 "$PLANNED_REQUESTS"); do
                returned_id="$(cat "${RESULT_DIR}/${request}.request-id")"
                event_count="$(awk -v id="\"requestId\":\"${returned_id}\"" 'index($0,"TENANT_READ_SHADOW_EVENT=") && index($0,id){n++} END{print n+0}' "$SHADOW_LOG")"
                observed=$((observed + event_count))
              done
              if [ "$observed" = "$PLANNED_REQUESTS" ]; then EVENTS_COMPLETE=true; break; fi
              sleep 1
              SHADOW_UNTIL="$(date -u -d '+1 second' +%FT%TZ)"
            done
            if [ "$EVENTS_COMPLETE" != "true" ]; then fail_shadow_proof requests_or_events; fi

            PROOF_FAILED=false
            for request in $(seq 1 "$PLANNED_REQUESTS"); do
              returned_id="$(cat "${RESULT_DIR}/${request}.request-id")"
              status="$(cat "${RESULT_DIR}/${request}.status")"
              exit_code="$(cat "${RESULT_DIR}/${request}.exit")"
              event_count="$(awk -v id="\"requestId\":\"${returned_id}\"" 'index($0,"TENANT_READ_SHADOW_EVENT=") && index($0,id){n++} END{print n+0}' "$SHADOW_LOG")"
              request_match_count="$(awk -v id="\"requestId\":\"${returned_id}\"" 'index($0,"TENANT_READ_SHADOW_EVENT=") && index($0,id) && index($0,"\"result\":\"MATCH\""){n++} END{print n+0}' "$SHADOW_LOG")"
              request_mismatch_count="$(awk -v id="\"requestId\":\"${returned_id}\"" 'index($0,"TENANT_READ_SHADOW_EVENT=") && index($0,id) && index($0,"\"result\":\"MISMATCH\""){n++} END{print n+0}' "$SHADOW_LOG")"
              printf '%s\n' "$event_count" > "${RESULT_DIR}/${request}.events"
              MATCH_COUNT=$((MATCH_COUNT + request_match_count))
              MISMATCH_COUNT=$((MISMATCH_COUNT + request_mismatch_count))
              if [ "$status" != "200" ] || [ "$exit_code" != "0" ] || [ "$event_count" != "1" ] || [ "$request_match_count" != "1" ] || [ "$request_mismatch_count" != "0" ]; then PROOF_FAILED=true; fi
            done
            if [ "$MATCH_COUNT" != "$PLANNED_REQUESTS" ] || [ "$MISMATCH_COUNT" != "0" ]; then PROOF_FAILED=true; fi
            if [ "$PROOF_FAILED" = "true" ]; then fail_shadow_proof requests_or_events; fi
            STABILITY_DURATION_SECONDS=$(( $(date +%s) - STABILITY_STARTED_EPOCH ))
            echo "TENANT_READ_PREVIEW_HTTP=200x${HTTP_200_COUNT}"
            echo "TENANT_READ_PREVIEW_SHADOW=MATCH"
            echo "TENANT_READ_PREVIEW_STABILITY_CYCLES=10"
            echo "TENANT_READ_PREVIEW_STABILITY_REQUESTS=40"
            echo "TENANT_READ_PREVIEW_STABILITY_MATCH=40"
            echo "TENANT_READ_PREVIEW_STABILITY_MISMATCH=0"
            echo "TENANT_READ_PREVIEW_STABILITY={\"runId\":\"${STABILITY_RUN_ID}\",\"cyclesPlanned\":${STABILITY_CYCLES},\"cyclesCompleted\":${COMPLETED_CYCLES},\"requestsPlanned\":${PLANNED_REQUESTS},\"requestsCompleted\":${COMPLETED_REQUESTS},\"http200Total\":${HTTP_200_COUNT},\"matchTotal\":${MATCH_COUNT},\"mismatchTotal\":${MISMATCH_COUNT},\"missingIds\":${MISSING_ID_COUNT},\"duplicateIds\":${DUPLICATE_ID_COUNT},\"durationSeconds\":${STABILITY_DURATION_SECONDS},\"result\":\"PASS\"}"
            echo "TENANT_READ_PREVIEW_STABILITY=PASS"
            PILOT_ACTIVATED=false



      - name: Comment preview link on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            🚀 Preview environment updated.

            Preview URL (HTTPS): ${{ env.PREVIEW_URL }}
            Preview URL (HTTP fallback): ${{ env.PREVIEW_URL_HTTP }}
            Banco do preview é isolado e populado com dados fictícios via ENABLE_PREVIEW_SEED=true.
            Credenciais sintéticas: solicite-as ao proprietário autorizado que mantém os secrets PREVIEW_AUTH_EMAIL/PREVIEW_AUTH_PASSWORD no GitHub Environment `preview`. Valores não são recuperáveis pela interface do GitHub nem publicados aqui.
