name: Docker Compose CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record checkout lockfile
        run: |
          lock_hash=$(sha256sum package-lock.json | cut -d' ' -f1)
          if [[ -n $(git status --porcelain=v1 -- package-lock.json) ]]; then
            echo "LOCKFILE_STATE_AFTER_CHECKOUT=MODIFIED"
            echo "FIRST_DIRTY_STEP=checkout"
            echo "LOCKFILE_HASH_AFTER_CHECKOUT=$lock_hash"
            exit 1
          fi
          echo "LOCKFILE_STATE_AFTER_CHECKOUT=CLEAN"
          echo "LOCKFILE_HASH_AFTER_CHECKOUT=$lock_hash"
          echo "PR827_LOCKFILE_BASELINE_SHA256=$lock_hash" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Preview image lifecycle (synthetic Docker)
        run: npm run test:preview-images:docker:repeated

      - name: Prove preview cleanup workflow shell
        run: npm run test:docker-cleanup-safety

      - name: Pin and verify Node/npm
        run: |
          npm install --global npm@11.4.2
          test "$(node --version)" = v20.19.5
          test "$(npm --version)" = 11.4.2
          lock_hash=$(sha256sum package-lock.json | cut -d' ' -f1)
          echo "NODE_VERSION=$(node --version)"
          echo "NPM_VERSION=$(npm --version)"
          if [[ "$lock_hash" != "$PR827_LOCKFILE_BASELINE_SHA256" ]] || [[ -n $(git status --porcelain=v1 -- package-lock.json) ]]; then
            echo "LOCKFILE_STATE_AFTER_TOOLCHAIN_SETUP=MODIFIED"
            echo "FIRST_DIRTY_STEP=toolchain_setup"
            echo "LOCKFILE_HASH_AFTER_TOOLCHAIN_SETUP=$lock_hash"
            exit 1
          fi
          echo "LOCKFILE_STATE_AFTER_TOOLCHAIN_SETUP=CLEAN"
          echo "LOCKFILE_HASH_AFTER_TOOLCHAIN_SETUP=$lock_hash"

      - name: Install dependencies
        run: |
          npm ci
          lock_hash=$(sha256sum package-lock.json | cut -d' ' -f1)
          if [[ "$lock_hash" != "$PR827_LOCKFILE_BASELINE_SHA256" ]] || [[ -n $(git status --porcelain=v1 -- package-lock.json) ]]; then
            echo "LOCKFILE_STATE_AFTER_DEPENDENCY_INSTALL=MODIFIED"
            echo "FIRST_DIRTY_STEP=dependency_install"
            echo "LOCKFILE_HASH_AFTER_DEPENDENCY_INSTALL=$lock_hash"
            exit 1
          fi
          echo "LOCKFILE_STATE_AFTER_DEPENDENCY_INSTALL=CLEAN"
          echo "LOCKFILE_HASH_AFTER_DEPENDENCY_INSTALL=$lock_hash"

      - name: Build workspace @salesforce-pro/shared
        run: npm run build -w @salesforce-pro/shared

      - name: Build workspace @salesforce-pro/web
        run: npm run build -w @salesforce-pro/web

      - name: Build workspace @salesforce-pro/api
        run: npm run build -w @salesforce-pro/api

      - name: Type check (all workspaces)
        run: npm run typecheck

      - name: Validate effective wins and ERP cancellation regressions
        run: npm run test:effective-wins

      - name: Validate control-plane operational gates
        run: npm run test:tenancy-control-plane-operation

      - name: Prove ERP production recovery contract
        run: npm run test:erp-production-recovery

      - name: Prove concurrent preview run isolation
        run: npm run test:preview-isolation

      - name: Validate ERP client data allowlist and credit alert projection
        run: npm run test:client-erp-projection -w @salesforce-pro/api

      - name: Validate UltraFV3 financial sync across sellers and shared sync lock
        run: npm run test:ultrafv3-financial-sync -w @salesforce-pro/api

      - name: Validate partner sync never duplicates legacy clients without tenant
        run: npm run test:ultrafv3-partners-legacy-tenant -w @salesforce-pro/api

      - name: Cache PostgreSQL 16 image for pull-free restore harness
        env:
          POSTGRES_TEST_IMAGE: postgres:16
        run: |
          if docker image inspect "$POSTGRES_TEST_IMAGE" >/dev/null 2>&1; then
            echo "POSTGRES_IMAGE_PULL_ATTEMPT=0"
            echo "POSTGRES_IMAGE_PULL_RESULT=ALREADY_AVAILABLE"
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "POSTGRES_IMAGE_PULL_ATTEMPT=$attempt"
            if docker pull "$POSTGRES_TEST_IMAGE" >/dev/null; then
              echo "POSTGRES_IMAGE_PULL_RESULT=PASS"
              exit 0
            fi
            echo "POSTGRES_IMAGE_PULL_RESULT=RETRY"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 2)); fi
          done
          echo "POSTGRES_IMAGE_PULL_RESULT=FAIL"
          exit 1

      - name: Execute every PR827 preview diagnostic on PostgreSQL 16
        run: |
          lock_hash=$(sha256sum package-lock.json | cut -d' ' -f1)
          if [[ "$lock_hash" != "$PR827_LOCKFILE_BASELINE_SHA256" ]] || [[ -n $(git status --porcelain=v1 -- package-lock.json) ]]; then
            echo "LOCKFILE_STATE_BEFORE_PR827_HARNESS=MODIFIED"
            echo "FIRST_DIRTY_STEP=pre_harness_build_or_test"
            echo "LOCKFILE_HASH_BEFORE_PR827_HARNESS=$lock_hash"
            exit 1
          fi
          echo "LOCKFILE_STATE_BEFORE_PR827_HARNESS=CLEAN"
          echo "LOCKFILE_HASH_BEFORE_PR827_HARNESS=$lock_hash"
          npm_rc=0
          if npm run test:pr827-preview:postgres; then npm_rc=0
          else npm_rc=$?; fi
          echo "NPM_LIFECYCLE_RC=$npm_rc"
          echo "WORKFLOW_COMMAND_RC=$npm_rc"
          exit "$npm_rc"

      - name: Prove PR827 legacy apply atomically on PostgreSQL 16
        run: npm run test:pr827-apply:postgres

      - name: Build SHA-pinned API image for control-plane harness
        run: docker build --pull=false --build-arg APP_COMMIT="$GITHUB_SHA" --build-arg APP_VERSION=ci --build-arg APP_BUILT_AT="$(date -u +%FT%TZ)" -t "gest-o-api:$GITHUB_SHA" -f apps/api/Dockerfile .

      - name: Prove control-plane migration and tenant preparation
        env:
          API_IMAGE: gest-o-api:${{ github.sha }}
        run: npm run test:tenancy-control-plane-operation:postgres

      - name: Prove tenancy roots expand on PostgreSQL 16
        env:
          API_IMAGE: gest-o-api:${{ github.sha }}
        run: npm run test:tenancy-expand:postgres

      - name: Prove tenancy backfill tooling on PostgreSQL 16
        env:
          API_IMAGE: gest-o-api:${{ github.sha }}
        run: npm run test:tenancy-backfill:postgres

      - name: Prove TenantContext auth compatibility
        run: npm run test:tenant-context-auth

      - name: Prove tenant-scoped data access isolation
        run: npm run test:tenant-data-access

      - name: Prove tenant relational ownership isolation
        run: npm run test:tenant-relational-ownership

      - name: Prove Activity dual-parent enforcement on PostgreSQL 16
        env:
          API_IMAGE: gest-o-api:${{ github.sha }}
        run: npm run test:tenant-activity-dual-parent:postgres

      - name: Prove Agenda and Timeline tenant ownership isolation
        run: npm run test:tenant-agenda-timeline

      - name: Prove Agenda descendants tenant ownership isolation
        run: npm run test:tenant-agenda-descendants

      - name: Prove tenant read-only pilot isolation
        run: npm run test:tenant-read-pilot

      - name: Prove tenant read pilot preview dataset
        env:
          API_IMAGE: gest-o-api:${{ github.sha }}
        run: npm run test:tenant-read-pilot-preview-seed

      - name: Prove tenant read pilot preview stability contract
        run: npm run test:tenant-read-pilot-preview-stability

      - name: Prove tenant data readiness preflight on PostgreSQL 16
        run: npm run test:tenant-data-readiness:postgres

      - name: Prove preflight-gated backfill planning on PostgreSQL 16
        run: npm run test:preflight-gated-backfill-plan:postgres

      - name: Prove preflight evidence and plan ledger on PostgreSQL 16
        run: npm run test:preflight-plan-ledger:postgres

      - name: Prove synthetic PostgreSQL 16 backup restore
        run: npm run test:production-backup-restore:postgres

      - name: Validate Docker Compose config
        env:
          DATABASE_SCHEMA_MODE: "ephemeral-push"
          ENABLE_SMOKE_BOOTSTRAP: "true"
          SEED_ON_BOOTSTRAP: "true"
          ADMIN_BOOTSTRAP_ENABLED: "true"
          ADMIN_BOOTSTRAP_EMAIL: "diretor@empresa.com"
          ADMIN_BOOTSTRAP_PASSWORD: "123456"
          ADMIN_BOOTSTRAP_ROLE: "diretor"
          ADMIN_BOOTSTRAP_REGION: "Nacional"
        run: docker compose config

      - name: Build and start stack
        env:
          DATABASE_SCHEMA_MODE: "ephemeral-push"
          ENABLE_SMOKE_BOOTSTRAP: "true"
          SEED_ON_BOOTSTRAP: "true"
          ADMIN_BOOTSTRAP_ENABLED: "true"
          ADMIN_BOOTSTRAP_EMAIL: "diretor@empresa.com"
          ADMIN_BOOTSTRAP_PASSWORD: "123456"
          ADMIN_BOOTSTRAP_ROLE: "diretor"
          ADMIN_BOOTSTRAP_REGION: "Nacional"
        run: docker compose up -d --build

      - name: Print API logs on failure
        if: failure()
        run: docker compose logs api

      - name: Wait for API health
        run: |
          for i in {1..60}; do
            if ! STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4000/health); then
              STATUS=000
            fi
            if [ "$STATUS" = "200" ]; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose logs api
          exit 1

      - name: Smoke test API main endpoints
        run: node scripts/smoke/api-endpoints-smoke.mjs

      - name: Prove ERP platform health observability
        run: |
          npm run test:platform-health-erp-observability
          node scripts/smoke/ultrafv3-reachability-safety.mjs

      - name: Smoke test auth login
        run: |
          LOGIN_HTTP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" -X POST http://localhost:4000/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"diretor@empresa.com","password":"123456"}')"
          test "$LOGIN_HTTP_STATUS" = "200"

      - name: Smoke test opportunities + dashboard flow
        run: |
          node --test scripts/smoke/dashboard-month.test.mjs
          node scripts/smoke/compose-smoke.mjs

      - name: Print service status
        if: always()
        run: docker compose ps

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

