name: Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy trusted cleanup implementation to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22022
          source: scripts/preview-image-lifecycle.mjs
          target: /tmp/gesto-preview-cleanup-${{ github.run_id }}
      - name: Cleanup completed preview runs on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_OWNER_REPOSITORY: ${{ github.repository }}
          CLEANUP_SCRIPT: /tmp/gesto-preview-cleanup-${{ github.run_id }}/scripts/preview-image-lifecycle.mjs
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22022
          script_stop: true
          envs: PR_NUMBER,GITHUB_REPOSITORY,GITHUB_TOKEN,EXPECTED_PREVIEW_SHA,PREVIEW_OWNER_REPOSITORY,CLEANUP_SCRIPT
          script: |
            set -euo pipefail
            projects_file="$(mktemp)"
            trap 'rm -f "$projects_file"; rm -rf "$(dirname "$(dirname "$CLEANUP_SCRIPT")")"' EXIT
            docker ps -a --filter "label=com.gesto.preview=true" --filter "label=com.gesto.preview.pr=${PR_NUMBER}" --format '{{.Label "com.docker.compose.project"}}' >> "$projects_file"
            docker network ls --filter "label=com.gesto.preview=true" --filter "label=com.gesto.preview.pr=${PR_NUMBER}" --format '{{.Label "com.docker.compose.project"}}' >> "$projects_file"
            docker volume ls --filter "label=com.gesto.preview=true" --filter "label=com.gesto.preview.pr=${PR_NUMBER}" --format '{{.Label "com.docker.compose.project"}}' >> "$projects_file"
            if [ -d /var/www/preview-provenance ]; then
              find /var/www/preview-provenance -maxdepth 1 -type f -name "gesto-pr-${PR_NUMBER}-*.json" -printf '%f\n' |
                sed 's/\.json$//' >> "$projects_file"
            fi
            sort -u "$projects_file" -o "$projects_file"

            while IFS= read -r project; do
              [ -n "$project" ] || continue
              case "$project" in "gesto-pr-${PR_NUMBER}-"*) ;; *) echo 'PREVIEW_ORPHAN_SCOPE=REJECTED_PROJECT'; exit 1;; esac
              owner_id="$(docker ps -aq --filter "label=com.docker.compose.project=${project}" | head -n 1)"
              manifest_path="/var/www/preview-provenance/${project}.json"
              if [ -n "$owner_id" ]; then
                owner_pr="$(docker inspect -f '{{ index .Config.Labels "com.gesto.preview.pr" }}' "$owner_id")"
                owner_run="$(docker inspect -f '{{ index .Config.Labels "com.gesto.preview.run-id" }}' "$owner_id")"
                owner_attempt="$(docker inspect -f '{{ index .Config.Labels "com.gesto.preview.run-attempt" }}' "$owner_id")"
                owner_workflow="$(docker inspect -f '{{ index .Config.Labels "com.gesto.preview.workflow" }}' "$owner_id")"
              elif network_id="$(docker network ls -q --filter "label=com.docker.compose.project=${project}" | head -n 1)" && [ -n "$network_id" ]; then
                owner_pr="$(docker network inspect -f '{{ index .Labels "com.gesto.preview.pr" }}' "$network_id")"
                owner_run="$(docker network inspect -f '{{ index .Labels "com.gesto.preview.run-id" }}' "$network_id")"
                owner_attempt="$(docker network inspect -f '{{ index .Labels "com.gesto.preview.run-attempt" }}' "$network_id")"
                owner_workflow="$(docker network inspect -f '{{ index .Labels "com.gesto.preview.workflow" }}' "$network_id")"
              else
                manifest_facts="$(node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync(process.argv[1]));if(m.format!==1||m.project!==process.argv[2]||!Array.isArray(m.images)||m.images.length!==2)process.exit(1);const v=m.images.map(x=>x.labels||{});for(const k of ["pr","run-id","run-attempt","workflow"]){if(!v[0][k]||v.some(x=>x[k]!==v[0][k]))process.exit(1)}process.stdout.write([v[0].pr,v[0]["run-id"],v[0]["run-attempt"],v[0].workflow].join("\t"))' "$manifest_path" "$project")"
                IFS=$'\t' read -r owner_pr owner_run owner_attempt owner_workflow <<<"$manifest_facts"
              fi
              [ "$owner_pr" = "$PR_NUMBER" ]
              [ "$owner_workflow" = Preview-Deploy ]
              run_facts="$(curl -fsS -H "Authorization: Bearer ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${owner_run}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(typeof x.status!=="string"||!(/^[a-f0-9]{40}$/).test(x.head_sha||""))process.exit(1);process.stdout.write(x.status+"\t"+x.head_sha)})')"
              IFS=$'\t' read -r run_status producer_sha <<<"$run_facts"
              [ "$run_status" = completed ]
              export EXPECTED_PREVIEW_SHA="$producer_sha"
              export PREVIEW_OWNER_PR="$owner_pr" PREVIEW_OWNER_RUN_ID="$owner_run" PREVIEW_OWNER_RUN_ATTEMPT="$owner_attempt"
              export PREVIEW_OWNER_WORKFLOW="$owner_workflow" COMPOSE_PROJECT_NAME="$project"
              preview_dir="/var/www/preview/pr-${PR_NUMBER}/${project}"
              resource_count=$(( $(docker ps -aq --filter "label=com.docker.compose.project=${project}" | wc -l) + $(docker network ls -q --filter "label=com.docker.compose.project=${project}" | wc -l) + $(docker volume ls -q --filter "label=com.docker.compose.project=${project}" | wc -l) ))
              if [ "$resource_count" -eq 0 ]; then
                echo "PREVIEW_RESOURCE_CLEANUP=ALREADY_ABSENT project=${project}"
              elif [ -f "$preview_dir/docker-compose.yml" ] && [ -f "$preview_dir/docker-compose.preview.yml" ]; then
                (cd "$preview_dir" && docker compose -p "$project" -f docker-compose.yml -f docker-compose.preview.yml down -v --remove-orphans)
              else
                echo "PREVIEW_ORPHAN_CLEANUP=PRESERVED reason=trusted_compose_files_missing project=${project}"
                exit 1
              fi
              node "$CLEANUP_SCRIPT" cleanup "$manifest_path"
              rm -rf "$preview_dir"
              echo "PREVIEW_ORPHAN_CLEANUP=PASS project=${project}"
            done < "$projects_file"

            sudo rm -f "/etc/nginx/sites-enabled/crm-preview-pr-${PR_NUMBER}" "/etc/nginx/sites-available/crm-preview-pr-${PR_NUMBER}"
            sudo nginx -t
            sudo systemctl reload nginx
