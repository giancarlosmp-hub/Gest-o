name: Preview Cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  defer-cleanup-pr-877:
    if: github.event.pull_request.number == 877
    runs-on: ubuntu-latest
    steps:
      - name: Defer PR 877 cleanup during network-capacity incident
        shell: bash
        run: |
          echo "PREVIEW_CLEANUP_RESULT=DEFERRED"
          echo "PREVIEW_CLEANUP_EXECUTED=NO"
          echo "PREVIEW_CLEANUP_REASON=PR_877_NETWORK_CAPACITY_INCIDENT"
          echo "Preview cleanup for PR #877 is explicitly deferred pending reviewed operational recovery."

  cleanup-preview:
    if: github.event.pull_request.number != 877
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy trusted cleanup implementation to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22022
          source: scripts/preview-image-lifecycle.mjs,scripts/preview-cleanup-remote.sh
          target: /tmp/gesto-preview-cleanup-${{ github.run_id }}
      - name: Cleanup completed preview runs on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_OWNER_REPOSITORY: ${{ github.repository }}
          CLEANUP_SCRIPT: /tmp/gesto-preview-cleanup-${{ github.run_id }}/scripts/preview-image-lifecycle.mjs
          CLEANUP_RUNNER: /tmp/gesto-preview-cleanup-${{ github.run_id }}/scripts/preview-cleanup-remote.sh
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22022
          script_stop: true
          envs: PR_NUMBER,GITHUB_REPOSITORY,GITHUB_TOKEN,EXPECTED_PREVIEW_SHA,PREVIEW_OWNER_REPOSITORY,CLEANUP_SCRIPT,CLEANUP_RUNNER
          script: |
            bash "$CLEANUP_RUNNER"
