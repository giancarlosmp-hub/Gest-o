name: VPS Drift Detection

on:
  schedule:
    # 06:00 BRT (UTC-3) = 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-drift-detection
  cancel-in-progress: false

jobs:
  check-drift:
    environment: production-backup-recovery
    runs-on: ubuntu-latest
    steps:
      - name: Verificação de Drift e Worktree na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER || secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY || secrets.VPS_KEY }}
          port: ${{ secrets.SSH_PORT || secrets.VPS_PORT || '22022' }}
          # Sem script_stop: o drone-ssh injeta uma checagem de $? depois de cada linha, que sai
          # com 1 logo após um `else` (regra no DEPLOY_GUIDE). O `set -Eeuo pipefail` abaixo cobre
          # a parada em erro, e o script não usa `else`.
          command_timeout: 10m
          debug: true
          script: |
            set -Eeuo pipefail
            cd /apps/gest-o

            # Atualiza referências do origin/main de forma estritamente somente-leitura
            git fetch origin main >/dev/null 2>&1 || true

            worktree_status="$(git status --porcelain 2>/dev/null || true)"
            local_sha="$(git rev-parse HEAD 2>/dev/null || echo 'UNKNOWN_LOCAL_SHA')"
            remote_sha="$(git rev-parse origin/main 2>/dev/null || echo 'UNKNOWN_REMOTE_SHA')"

            # Commit servido em produção, lido como no deploy (scripts/deploy-production.sh).
            health_json="$(curl -fsS --max-time 5 http://127.0.0.1:4000/health/version 2>/dev/null || true)"
            deployed_sha="$(printf '%s' "$health_json" | node -pe 'JSON.parse(require("fs").readFileSync(0)).commit' 2>/dev/null || true)"

            has_dirty_worktree=false
            has_health_failure=false
            has_deployed_drift=false

            if [[ -n "$worktree_status" ]]; then
              has_dirty_worktree=true
            fi

            if [[ ! "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
              has_health_failure=true
            fi

            if [[ "$has_health_failure" == false && "$local_sha" != "$deployed_sha" ]]; then
              has_deployed_drift=true
            fi

            # O commit em produção precisa estar contido na main (ex.: main reescrita ou commit local).
            has_unmerged_production=false
            if [[ "$has_health_failure" == false && "$has_deployed_drift" == false ]]; then
              if ! git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
                has_unmerged_production=true
              fi
            fi

            # Disco: o run falha (e o GitHub manda o e-mail) quando /, /var/lib/docker ou
            # /var/log/gest-o passa de 80%. Somente leitura; uso ilegível é mostrado e não reprova.
            disk_limit=80
            has_disk_full=false
            disk_report=""
            for disk_path in / /var/lib/docker /var/log/gest-o; do
              disk_line="$(df -P "$disk_path" 2>/dev/null | awk 'NR==2{print $6" "$5}' || true)"
              disk_pct="${disk_line##* }"
              disk_pct="${disk_pct%\%}"
              if [[ ! "$disk_pct" =~ ^[0-9]+$ ]]; then
                disk_report+="${disk_path}: uso ilegível"$'\n'
                continue
              fi
              disk_report+="${disk_path} (montado em ${disk_line% *}): ${disk_pct}%"$'\n'
              if (( disk_pct > disk_limit )); then has_disk_full=true; fi
            done
            printf 'Disco:\n%s' "$disk_report"

            if [[ "$has_disk_full" == true ]]; then
              printf '[CRITICAL] Disco acima de %s%% na VPS!\n\n' "$disk_limit" >&2
              printf '%s' "$disk_report" >&2
              printf '\n%s\n' '--- 5 maiores itens de /var/log/gest-o (MB) ---' >&2
              du -xsm /var/log/gest-o/* /var/log/gest-o/.[!.]* 2>/dev/null | sort -rn | head -n 5 >&2 || true
              printf '\n%s\n' '--- docker system df ---' >&2
              docker system df >&2 2>&1 || true
              printf '\n%s\n' '--- 5 maiores imagens ---' >&2
              docker image ls --format '{{.Size}}{{"\t"}}{{.ID}}{{"\t"}}{{.Repository}}:{{.Tag}}' 2>/dev/null | awk -F'\t' '!seen[$2]++' | sort -rh | head -n 5 >&2 || true
              printf '\n%s\n' '--- 5 maiores volumes ---' >&2
              docker system df -v 2>/dev/null | awk '/^Local Volumes space usage/{f=1; next} f && /^VOLUME NAME/{g=1; next} g && NF==0{exit} g{print $NF"\t"$1}' | sort -rh | head -n 5 >&2 || true
              printf '\nLimpeza manual: DEPLOY_GUIDE "Limpeza manual de disco na VPS".\n\n' >&2
            fi

            if [[ "$has_dirty_worktree" == true || "$has_health_failure" == true || "$has_deployed_drift" == true || "$has_unmerged_production" == true ]]; then
              printf '[CRITICAL] Drift detectado na VPS em /apps/gest-o!\n\n' >&2
              if [[ "$has_dirty_worktree" == true ]]; then
                printf '%s\n' '--- Working tree em /apps/gest-o não está limpo ---' >&2
                printf '%s\n\n' "$worktree_status" >&2
              fi
              if [[ "$has_health_failure" == true ]]; then
                printf '%s\n\n' '--- /health/version da API não respondeu ou não trouxe commit válido ---' >&2
              fi
              if [[ "$has_deployed_drift" == true ]]; then
                printf '%s\n' '--- Divergência de SHA entre HEAD local e o commit em produção ---' >&2
                printf 'HEAD local: %s\n' "$local_sha" >&2
                printf 'produção:   %s\n\n' "$deployed_sha" >&2
              fi
              if [[ "$has_unmerged_production" == true ]]; then
                printf '%s\n' '--- Commit em produção não está contido em origin/main ---' >&2
                printf 'produção:    %s\n' "$local_sha" >&2
                printf 'origin/main: %s\n\n' "$remote_sha" >&2
              fi
              printf 'Investigue antes de descartar. Ver runbook: docs/OPERACAO.md\n' >&2
              exit 1
            fi
            if [[ "$has_disk_full" == true ]]; then exit 1; fi

            # HEAD igual à produção: main à frente (merges ainda sem deploy) não é drift.
            if [[ "$local_sha" != "$remote_sha" ]]; then
              ahead="$(git rev-list --count HEAD..origin/main 2>/dev/null || echo '?')"
              printf '[INFO] main %s commits à frente da produção (origin/main %s).\n' "$ahead" "$remote_sha"
            fi
            printf '[OK] VPS working tree limpo e HEAD igual ao commit em produção (%s).\n' "$local_sha"
