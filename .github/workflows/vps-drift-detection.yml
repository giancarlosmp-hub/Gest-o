name: VPS Drift Detection

on:
  schedule:
    # Minuto 17: o GitHub atrasa mais os agendamentos na hora cheia (o de 09:00 UTC chegava a começar
    # 3 a 10 horas depois). Cada cron dispara o seu job (ver `if:` de cada job).
    # Drift diário: 06:17 BRT (UTC-3) = 09:17 UTC.
    - cron: '17 9 * * *'
    # Rede (ERP, DNS da API e Tailscale): de hora em hora.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-drift-detection
  cancel-in-progress: false

jobs:
  check-drift:
    # Disparo manual roda os dois jobs.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 9 * * *'
    environment: production-backup-recovery
    runs-on: ubuntu-latest
    steps:
      - name: Verificação de Drift e Worktree na VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER || secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY || secrets.VPS_KEY }}
          port: ${{ secrets.SSH_PORT || secrets.VPS_PORT || '22022' }}
          # Sem script_stop: o drone-ssh injeta uma checagem de $? depois de cada linha, que sai
          # com 1 logo após um `else` (regra no DEPLOY_GUIDE). O `set -Eeuo pipefail` abaixo cobre
          # a parada em erro, e o script não usa `else`.
          command_timeout: 10m
          debug: true
          script: |
            set -Eeuo pipefail
            cd /apps/gest-o

            # Atualiza referências do origin/main de forma estritamente somente-leitura
            git fetch origin main >/dev/null 2>&1 || true

            worktree_status="$(git status --porcelain 2>/dev/null || true)"
            local_sha="$(git rev-parse HEAD 2>/dev/null || echo 'UNKNOWN_LOCAL_SHA')"
            remote_sha="$(git rev-parse origin/main 2>/dev/null || echo 'UNKNOWN_REMOTE_SHA')"

            # Commit servido em produção, lido como no deploy (scripts/deploy-production.sh).
            health_json="$(curl -fsS --max-time 5 http://127.0.0.1:4000/health/version 2>/dev/null || true)"
            deployed_sha="$(printf '%s' "$health_json" | node -pe 'JSON.parse(require("fs").readFileSync(0)).commit' 2>/dev/null || true)"

            has_dirty_worktree=false
            has_health_failure=false
            has_deployed_drift=false

            if [[ -n "$worktree_status" ]]; then
              has_dirty_worktree=true
            fi

            if [[ ! "$deployed_sha" =~ ^[0-9a-f]{40}$ ]]; then
              has_health_failure=true
            fi

            if [[ "$has_health_failure" == false && "$local_sha" != "$deployed_sha" ]]; then
              has_deployed_drift=true
            fi

            # O commit em produção precisa estar contido na main (ex.: main reescrita ou commit local).
            has_unmerged_production=false
            if [[ "$has_health_failure" == false && "$has_deployed_drift" == false ]]; then
              if ! git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
                has_unmerged_production=true
              fi
            fi

            # Disco: o run falha (e o GitHub manda o e-mail) quando /, /var/lib/docker ou
            # /var/log/gest-o passa de 80%. Somente leitura; uso ilegível é mostrado e não reprova.
            disk_limit=80
            has_disk_full=false
            disk_report=""
            for disk_path in / /var/lib/docker /var/log/gest-o; do
              disk_line="$(df -P "$disk_path" 2>/dev/null | awk 'NR==2{print $6" "$5}' || true)"
              disk_pct="${disk_line##* }"
              disk_pct="${disk_pct%\%}"
              if [[ ! "$disk_pct" =~ ^[0-9]+$ ]]; then
                disk_report+="${disk_path}: uso ilegível"$'\n'
                continue
              fi
              disk_report+="${disk_path} (montado em ${disk_line% *}): ${disk_pct}%"$'\n'
              if (( disk_pct > disk_limit )); then has_disk_full=true; fi
            done
            printf 'Disco:\n%s' "$disk_report"

            if [[ "$has_disk_full" == true ]]; then
              printf '[CRITICAL] Disco acima de %s%% na VPS!\n\n' "$disk_limit" >&2
              printf '%s' "$disk_report" >&2
              printf '\n%s\n' '--- 5 maiores itens de /var/log/gest-o (MB) ---' >&2
              du -xsm /var/log/gest-o/* /var/log/gest-o/.[!.]* 2>/dev/null | sort -rn | head -n 5 >&2 || true
              printf '\n%s\n' '--- docker system df ---' >&2
              docker system df >&2 2>&1 || true
              printf '\n%s\n' '--- 5 maiores imagens ---' >&2
              docker image ls --format '{{.Size}}{{"\t"}}{{.ID}}{{"\t"}}{{.Repository}}:{{.Tag}}' 2>/dev/null | awk -F'\t' '!seen[$2]++' | sort -rh | head -n 5 >&2 || true
              printf '\n%s\n' '--- 5 maiores volumes ---' >&2
              docker system df -v 2>/dev/null | awk '/^Local Volumes space usage/{f=1; next} f && /^VOLUME NAME/{g=1; next} g && NF==0{exit} g{print $NF"\t"$1}' | sort -rh | head -n 5 >&2 || true
              printf '\nLimpeza manual: DEPLOY_GUIDE "Limpeza manual de disco na VPS".\n\n' >&2
            fi

            # WhatsApp (Evolution, projeto gest-o-whatsapp): opcional e somente leitura; do env só se testa
            # a existência. Env ausente = [INFO]; parado ou ausente = [WARN] sem reprovar; rodando sem
            # healthy ou com porta publicada = [CRITICAL].
            whatsapp_env=/root/demetra-env/whatsapp.env
            has_whatsapp_failure=false
            if [[ ! -e "$whatsapp_env" ]]; then
              printf '[INFO] WhatsApp (Evolution) não instalado: env protegido ausente.\n'
            fi
            if [[ -e "$whatsapp_env" ]]; then
              for whatsapp_service in evolution-api evolution-db; do
                whatsapp_cid="$(docker ps -aq --filter label=com.docker.compose.project=gest-o-whatsapp --filter "label=com.docker.compose.service=${whatsapp_service}" 2>/dev/null | head -n 1 || true)"
                whatsapp_state=ausente
                whatsapp_health=""
                whatsapp_ports=""
                if [[ -n "$whatsapp_cid" ]]; then
                  whatsapp_state="$(docker inspect -f '{{.State.Status}}' "$whatsapp_cid" 2>/dev/null || echo ausente)"
                  whatsapp_health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' "$whatsapp_cid" 2>/dev/null || true)"
                  whatsapp_ports="$(docker inspect -f '{{range $p, $b := .HostConfig.PortBindings}}{{$p}} {{end}}{{range $p, $b := .NetworkSettings.Ports}}{{range $b}}{{$p}}->{{.HostPort}} {{end}}{{end}}' "$whatsapp_cid" 2>/dev/null || true)"
                fi
                printf 'WhatsApp %s: %s %s\n' "$whatsapp_service" "$whatsapp_state" "$whatsapp_health"
                if [[ -n "$whatsapp_ports" ]]; then
                  printf '[CRITICAL] WhatsApp %s com porta publicada: %s\n' "$whatsapp_service" "$whatsapp_ports" >&2
                  has_whatsapp_failure=true
                fi
                if [[ "$whatsapp_state" == running && "$whatsapp_health" != healthy ]]; then
                  printf '[CRITICAL] WhatsApp %s rodando sem healthy (%s).\n' "$whatsapp_service" "${whatsapp_health:-sem healthcheck}" >&2
                  has_whatsapp_failure=true
                fi
                if [[ "$whatsapp_state" != running ]]; then
                  printf '[WARN] WhatsApp %s não está rodando (%s). Para subir: workflow WhatsApp Evolution com up.\n' "$whatsapp_service" "$whatsapp_state"
                fi
              done
            fi

            if [[ "$has_dirty_worktree" == true || "$has_health_failure" == true || "$has_deployed_drift" == true || "$has_unmerged_production" == true ]]; then
              printf '[CRITICAL] Drift detectado na VPS em /apps/gest-o!\n\n' >&2
              if [[ "$has_dirty_worktree" == true ]]; then
                printf '%s\n' '--- Working tree em /apps/gest-o não está limpo ---' >&2
                printf '%s\n\n' "$worktree_status" >&2
              fi
              if [[ "$has_health_failure" == true ]]; then
                printf '%s\n\n' '--- /health/version da API não respondeu ou não trouxe commit válido ---' >&2
              fi
              if [[ "$has_deployed_drift" == true ]]; then
                printf '%s\n' '--- Divergência de SHA entre HEAD local e o commit em produção ---' >&2
                printf 'HEAD local: %s\n' "$local_sha" >&2
                printf 'produção:   %s\n\n' "$deployed_sha" >&2
              fi
              if [[ "$has_unmerged_production" == true ]]; then
                printf '%s\n' '--- Commit em produção não está contido em origin/main ---' >&2
                printf 'produção:    %s\n' "$local_sha" >&2
                printf 'origin/main: %s\n\n' "$remote_sha" >&2
              fi
              printf 'Investigue antes de descartar. Ver runbook: docs/OPERACAO.md\n' >&2
              exit 1
            fi
            if [[ "$has_disk_full" == true ]]; then exit 1; fi
            if [[ "$has_whatsapp_failure" == true ]]; then exit 1; fi

            # HEAD igual à produção: main à frente (merges ainda sem deploy) não é drift.
            if [[ "$local_sha" != "$remote_sha" ]]; then
              ahead="$(git rev-list --count HEAD..origin/main 2>/dev/null || echo '?')"
              printf '[INFO] main %s commits à frente da produção (origin/main %s).\n' "$ahead" "$remote_sha"
            fi
            printf '[OK] VPS working tree limpo e HEAD igual ao commit em produção (%s).\n' "$local_sha"

  # Alerta de rede (TD-VPS-TAILSCALE-DEPENDENCY). O ERP e o DNS dos containers dependem do Tailscale da
  # VPS; o aviso é a falha deste run (e-mail do GitHub), que sai do runner pelo SSH público e não depende
  # do Tailscale, do DNS dos containers, da API nem do WhatsApp do CRM.
  check-network:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
    environment: production-backup-recovery
    runs-on: ubuntu-latest
    steps:
      - name: Verificação de rede (ERP, DNS da API e Tailscale)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER || secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY || secrets.VPS_KEY }}
          port: ${{ secrets.SSH_PORT || secrets.VPS_PORT || '22022' }}
          # Sem script_stop, como no job acima; o script não usa `else`.
          command_timeout: 5m
          debug: true
          script: |
            set -Eeuo pipefail
            # Somente leitura. De dentro da API: GET em ULTRAFV3_BASE_URL + /salesmen (a rota do preflight
            # da integração e do diagnose-ultrafv3-reachability.sh), sem credenciais, e resolução de
            # api.groq.com (DNS dos containers). Qualquer HTTP de 200 a 499 = a rede chega ao ERP (sem
            # token a rota responde 401); alerta só com 5xx, sem resposta ou timeout.
            # Até 3 tentativas, 20 s entre elas (cobre a recriação da API no cutover). Na falha, o log
            # diz se o Tailscale da VPS está logado e se o peer do ERP aparece online.
            # O log nunca mostra URL, IP ou nome de máquina.
            attempts=3
            retry_delay=20
            erp_js='const b=(process.env.ULTRAFV3_BASE_URL||"").replace(/\/+$/,"");if(!b){console.log("sem-config");process.exit(0)}fetch(b+"/salesmen",{method:"GET",redirect:"manual",signal:AbortSignal.timeout(8000)}).then(r=>console.log("http "+r.status),()=>console.log("sem-resposta"))'
            dns_js='require("dns").promises.lookup("api.groq.com").then(()=>console.log("ok"),e=>console.log("falha "+String(e.code||"ERRO").replace(/[^A-Z_]/g,"")))'
            erp_host_js='try{console.log(new URL(process.env.ULTRAFV3_BASE_URL).hostname.replace(/^\[|\]$/g,""))}catch{}'
            ts_js='let s;try{s=JSON.parse(require("fs").readFileSync(0,"utf8"))}catch{console.log("sem-resposta");process.exit(0)}const n=v=>String(v||"").toLowerCase().replace(/\.$/,"");const h=n(process.env.ERP_HOST);const p=h?Object.values(s.Peer||{}).find(x=>(x.TailscaleIPs||[]).includes(h)||n(x.DNSName)===h||n(x.DNSName).split(".")[0]===h||n(x.HostName)===h):null;console.log(String(s.BackendState||"desconhecido").replace(/[^A-Za-z]/g,"")+" "+(!h?"sem-host":p?(p.Online?"online":"offline"):"nao-identificado"))'
            erp_ok_re='^http [234][0-9][0-9]$'
            erp_http_re='^http ([0-9]{3})$'
            dns_fail_re='^falha ([A-Z_]+)$'

            api_cid=""
            erp_result=""
            dns_result=""
            erp_ok=false
            dns_ok=false
            for attempt in $(seq 1 "$attempts"); do
              api_cid="$(docker ps -q --filter label=com.docker.compose.project=gest-o-production --filter label=com.docker.compose.service=api 2>/dev/null | head -n 1 || true)"
              erp_result=api-ausente
              dns_result=api-ausente
              if [[ -n "$api_cid" ]]; then
                erp_result="$(timeout 20 docker exec "$api_cid" node -e "$erp_js" 2>/dev/null || true)"
                dns_result="$(timeout 20 docker exec "$api_cid" node -e "$dns_js" 2>/dev/null || true)"
              fi
              erp_ok=false
              dns_ok=false
              if [[ "$erp_result" =~ $erp_ok_re ]]; then erp_ok=true; fi
              if [[ "$dns_result" == ok ]]; then dns_ok=true; fi
              if [[ "$erp_ok" == true && "$dns_ok" == true ]]; then break; fi
              if (( attempt < attempts )); then
                printf '[INFO] Tentativa %s de %s com falha; nova tentativa em %s s.\n' "$attempt" "$attempts" "$retry_delay"
                sleep "$retry_delay"
              fi
            done

            erp_label="sem resposta"
            if [[ "$erp_result" =~ $erp_http_re ]]; then erp_label="HTTP ${BASH_REMATCH[1]}"; fi
            if [[ "$erp_result" == sem-config ]]; then erp_label="ULTRAFV3_BASE_URL ausente na API"; fi
            if [[ "$erp_result" == api-ausente ]]; then erp_label="container da API não encontrado"; fi
            dns_label="sem resposta"
            if [[ "$dns_result" == ok ]]; then dns_label=ok; fi
            if [[ "$dns_result" =~ $dns_fail_re ]]; then dns_label="falha (${BASH_REMATCH[1]})"; fi
            if [[ "$dns_result" == api-ausente ]]; then dns_label="container da API não encontrado"; fi

            if [[ "$erp_ok" == true ]]; then printf 'ERP: ok (%s)\n' "$erp_label"; fi
            if [[ "$erp_ok" != true ]]; then printf '[CRITICAL] ERP: %s.\n' "$erp_label" >&2; fi
            if [[ "$dns_ok" == true ]]; then printf 'DNS da API (api.groq.com): ok\n'; fi
            if [[ "$dns_ok" != true ]]; then printf '[CRITICAL] DNS da API (api.groq.com): %s.\n' "$dns_label" >&2; fi

            if [[ "$erp_ok" == true && "$dns_ok" == true ]]; then
              printf '[OK] ERP respondendo e DNS da API funcionando.\n'
              exit 0
            fi

            # Diagnóstico: só tailscale status (leitura). O host do ERP fica só em variável.
            erp_host=""
            if [[ -n "$api_cid" ]]; then erp_host="$(timeout 20 docker exec "$api_cid" node -e "$erp_host_js" 2>/dev/null || true)"; fi
            ts_json="$(timeout 10 tailscale status --json 2>/dev/null || true)"
            ts_report="$(printf '%s' "$ts_json" | ERP_HOST="$erp_host" node -e "$ts_js" 2>/dev/null || true)"
            ts_state="${ts_report%% *}"
            ts_peer="${ts_report#* }"
            ts_label="sem resposta do tailscale status"
            if [[ "$ts_state" =~ ^[A-Za-z]+$ ]]; then ts_label="estado $ts_state"; fi
            if [[ "$ts_state" == Running ]]; then ts_label="logado e rodando (Running)"; fi
            if [[ "$ts_state" == NeedsLogin ]]; then ts_label="DESLOGADO (NeedsLogin): refazer o login do Tailscale na VPS"; fi
            peer_label="não verificado (sem resposta do tailscale status)"
            if [[ "$ts_label" != "sem resposta do tailscale status" ]]; then peer_label="não identificado na lista de peers"; fi
            if [[ "$ts_peer" == online ]]; then peer_label=online; fi
            if [[ "$ts_peer" == offline ]]; then peer_label="OFFLINE: conferir a máquina do ERP e o Tailscale nela"; fi
            if [[ "$ts_peer" == sem-host ]]; then peer_label="não verificado (host do ERP não lido da API)"; fi
            printf '%s\n' '--- Diagnóstico ---' >&2
            printf 'Tailscale da VPS: %s\n' "$ts_label" >&2
            printf 'Peer do ERP no Tailscale: %s\n' "$peer_label" >&2
            printf 'Ver DEPLOY_GUIDE, seção "Alerta de rede (ERP, DNS e Tailscale)".\n' >&2
            exit 1
