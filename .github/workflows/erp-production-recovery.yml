name: ERP Production Recovery

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite RESTORE_ERP_AUTOMATIC_SYNC"
        required: true
        type: string
      expected_main_sha:
        description: "SHA completo da main aprovada após o merge"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: erp-production-recovery
  cancel-in-progress: false

jobs:
  recover:
    environment: production-cutover
    runs-on: ubuntu-latest
    steps:
      - name: Restaurar e comprovar scheduler ERP na VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          RECOVERY_CONFIRM: ${{ inputs.confirm }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          AUTH_TEST_EMAIL: ${{ secrets.AUTH_TEST_EMAIL }}
          AUTH_TEST_PASSWORD: ${{ secrets.AUTH_TEST_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER || secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY || secrets.VPS_KEY }}
          port: ${{ secrets.SSH_PORT || secrets.VPS_PORT || '22022' }}
          envs: RECOVERY_CONFIRM,EXPECTED_MAIN_SHA,AUTH_TEST_EMAIL,AUTH_TEST_PASSWORD
          script_stop: true
          command_timeout: 2h
          script: |
            set -euo pipefail
            test "$RECOVERY_CONFIRM" = RESTORE_ERP_AUTOMATIC_SYNC
            case "$EXPECTED_MAIN_SHA" in (*[!0-9a-f]*|'') exit 2;; esac
            test "${#EXPECTED_MAIN_SHA}" -eq 40
            cd /apps/gest-o
            test -z "$(git status --porcelain)"
            git fetch origin main
            git switch main
            git pull --ff-only origin main
            test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
            CONFIRM="$RECOVERY_CONFIRM" EXPECTED_SHA="$EXPECTED_MAIN_SHA" \
              AUTH_TEST_EMAIL="$AUTH_TEST_EMAIL" AUTH_TEST_PASSWORD="$AUTH_TEST_PASSWORD" \
              bash scripts/erp-production-recovery.sh
