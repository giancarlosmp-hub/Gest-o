name: Deploy Production
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "build executa preflight/build; cutover requer aprovação do environment"
        required: true
        type: choice
        options: [build, cutover]
permissions: { contents: read }
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  production:
    environment: ${{ inputs.phase == 'cutover' && 'production-cutover' || 'production-build' }}
    runs-on: ubuntu-latest
    steps:
      - name: Preflight, build e cutover controlado na VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_SHA: ${{ github.sha }}
          DEPLOY_MODE: ${{ inputs.phase }}
        with:
          host: ${{ secrets.SSH_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.SSH_USER || secrets.VPS_USER }}
          key: ${{ secrets.SSH_KEY || secrets.VPS_KEY }}
          port: ${{ secrets.SSH_PORT || '22022' }}
          envs: EXPECTED_SHA,DEPLOY_MODE
          script_stop: true
          script: |
            set -Eeuo pipefail
            bootstrap_stage=bootstrap_repository_access
            bootstrap_command=change_to_application_directory
            bootstrap_failure() {
              bootstrap_exit=$?
              trap - ERR
              printf 'DEPLOY_FAILURE_STAGE=%s\n' "$bootstrap_stage" >&2
              printf 'DEPLOY_FAILURE_COMMAND=%s\n' "$bootstrap_command" >&2
              printf 'DEPLOY_FAILURE_EXIT_CODE=%s\n' "$bootstrap_exit" >&2
              exit "$bootstrap_exit"
            }
            trap bootstrap_failure ERR
            cd /apps/gest-o
            bootstrap_stage=bootstrap_git_fetch
            bootstrap_command=git_fetch_main
            git fetch origin main
            bootstrap_stage=bootstrap_git_switch
            bootstrap_command=git_switch_main
            git switch main
            bootstrap_stage=bootstrap_git_fast_forward
            bootstrap_command=git_pull_fast_forward_main
            git pull --ff-only origin main
            trap - ERR
            APP_DIR=/apps/gest-o bash /apps/gest-o/scripts/production-deploy-entrypoint.sh
